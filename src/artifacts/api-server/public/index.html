<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIWI VC</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <div id="status-bar">
      <div id="status-dot"></div>
      <span id="status-text">Connecting...</span>
      <div id="room-info"></div>
    </div>

    <div id="main">
      <div id="controls">
        <button id="mute-btn" class="control-btn" title="Mute/Unmute">
          <svg id="mic-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
          </svg>
          <svg id="muted-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V20c0 .55.45 1 1 1s1-.45 1-1v-2.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>
          </svg>
        </button>
        <button id="deafen-btn" class="control-btn" title="Deafen/Undeafen">
          <svg id="headphone-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 1c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h1c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-2c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h1c1.66 0 3-1.34 3-3v-7c0-4.97-4.03-9-9-9z"/>
          </svg>
          <svg id="deafened-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <path d="M3.63 3.63c-.39.39-.39 1.02 0 1.41L7.29 8.7 7 9H5c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h1c1.1 0 2-.9 2-2v-4c0-.36-.09-.69-.22-1l1.58 1.58C9.12 11.9 9 12.19 9 12.5v.5c0 1.1.9 2 2 2v3h2v-3c.28 0 .54-.07.78-.17l7.81 7.81c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L5.05 3.63c-.4-.39-1.03-.39-1.42 0zM19 11v2h-2v-2c0-3.87-3.13-7-7-7-1.27 0-2.46.35-3.47.95l-1.41-1.41C6.51 2.54 9.1 2 12 2c4.97 0 9 4.03 9 9zm-7 9h-2v-3.07c-.84-.22-1.55-.75-2.01-1.47L9.4 16.9c.72.69 1.65 1.1 2.6 1.1v2z"/>
          </svg>
        </button>
        <div id="volume-control">
          <svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;opacity:0.6">
            <path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5zm7-.17v6.34L9.83 13H7v-2h2.83L12 8.83z"/>
          </svg>
          <input type="range" id="master-volume" min="0" max="200" value="100" />
        </div>
      </div>

      <div id="participants-section">
        <div id="participants-header">
          <span id="room-label">Voice Room</span>
          <span id="participant-count">0 connected</span>
        </div>
        <div id="participants-list"></div>
      </div>
    </div>

    <div id="permission-overlay" class="overlay">
      <div class="overlay-card">
        <div class="overlay-icon">🎙️</div>
        <h2>Microphone Access</h2>
        <p>This page needs access to your microphone to enable voice chat.</p>
        <button id="allow-mic-btn" class="primary-btn">Allow Microphone</button>
        <p class="hint">Make sure you are using Chrome, Firefox, or Edge.</p>
      </div>
    </div>

    <div id="error-overlay" class="overlay" style="display:none">
      <div class="overlay-card">
        <div class="overlay-icon">⚠️</div>
        <h2 id="error-title">Connection Error</h2>
        <p id="error-message">Could not connect to voice chat.</p>
        <button id="retry-btn" class="primary-btn">Retry</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
