kind = "web"
previewPath = "/"
title = "Roblox Voice Chat"
version = "1.0.0"
id = "artifacts/voice-chat"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22279

[services.development]
run = "pnpm --filter @workspace/voice-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voice-chat", "run", "build" ]
publicDir = "artifacts/voice-chat/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22279"
BASE_PATH = "/"
